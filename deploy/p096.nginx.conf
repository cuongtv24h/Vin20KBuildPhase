# Cấu hình Nginx cho PricePolicy AI Agent (P-096)
# Đặt tại: /etc/nginx/sites-available/p096.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/p096.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name demoday.work.gd;

    # 1. Phục vụ Frontend SPA (Vite Production Build)
    root /home/ubuntu/vland/frontend/apps/internal/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bộ nhớ đệm tài nguyên tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Reverse Proxy cho Backend API & AI Agent Streaming (FastAPI port 8000)
    # Audio ghi âm từ micro gửi lên /api/v1/stt/transcribe: mặc định nginx chỉ cho 1 MB ⇒ clip dài bị 413.
    # Trần 12 MB rộng hơn mức backend tự chặn (STT_MAX_BYTES = 10 MB) để lỗi do backend nói, có câu tiếng Việt.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình BẮT BUỘC cho AI Streaming & Server-Sent Events (SSE)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Endpoint kiểm tra sức khỏe
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
